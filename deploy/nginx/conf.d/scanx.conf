# scanX reverse proxy. Listens on unprivileged ports inside the container;
# compose maps 80→8080 and 443→8443.

server_tokens off;
client_max_body_size 5m;          # webhook body limit (spec §11.1); CI upload gets its own location later

limit_req_zone $binary_remote_addr zone=scanx_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=scanx_general:10m rate=20r/s;

# Resolve the app container at runtime (Docker DNS) instead of once at
# startup: after a reboot nginx may start before the server container, and a
# static upstream would make nginx exit with "host not found in upstream".
resolver 127.0.0.11 valid=10s ipv6=off;

upstream scanx_server {
    zone scanx_server 64k;
    server server:8080 resolve;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Set here (so nginx's own 429/502 pages carry them) and hide the app's
    # copies to avoid duplicate headers. CSP etc. still come from the app.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location = /api/v1/auth/login {
        limit_req zone=scanx_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://scanx_server;
    }

    # Metrics are internal only.
    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=scanx_general burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://scanx_server;
    }
}
