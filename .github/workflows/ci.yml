name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# All Go steps run in the same dev container as local development (ADR-004).
# TODO(T-0008b): pin third-party actions by commit SHA before v1.0.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dev.sh lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dev.sh test

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dev.sh test-integration

  image-and-smoke:
    runs-on: ubuntu-latest
    needs: [lint, test, test-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::12} -t ghcr.io/ininia/scanx:dev .
      - name: Compose smoke test (/health/ready must be 200)
        run: |
          cp deploy/.env.example deploy/.env
          docker run --rm ghcr.io/ininia/scanx:dev gen-secrets >> deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
          for i in $(seq 1 60); do
            if curl -fsk https://localhost/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v
