name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# All Go steps run in the same dev container as local development (ADR-004).
# TODO(T-0008b): pin third-party actions by commit SHA before v1.0.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dev.sh lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dev.sh test

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dev.sh test-integration

  image-and-smoke:
    runs-on: ubuntu-latest
    needs: [lint, test, test-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::12} -t ghcr.io/ininia/scanx:dev .
      - name: Compose smoke test (/health/ready must be 200)
        run: |
          cp deploy/.env.example deploy/.env
          docker run --rm ghcr.io/ininia/scanx:dev gen-secrets >> deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
          for i in $(seq 1 60); do
            if curl -fsk https://localhost/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v

  # Faz 1: build the all-in-one scanner image, verify it end-to-end on the
  # vulnerable fixture, then let scanX scan its own code (dogfooding, spec §18).
  scanner:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      security-events: write # upload the self-scan SARIF to Code Scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks history scan in the self-scan
      - name: Build scanner image
        run: docker build -f scanners/all-in-one/Dockerfile --build-arg VERSION=${GITHUB_SHA::12} -t ghcr.io/ininia/scanx-scanner-all:dev .
      - name: E2E scan of the vulnerable fixture
        run: bash scripts/e2e-scan.sh ghcr.io/ininia/scanx-scanner-all:dev
      - name: Self-scan (fail on high)
        run: |
          mkdir -p self-scan && chmod 0777 self-scan
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=2g \
            -v "$PWD:/work/src:ro" -v "$PWD/self-scan:/work/out" \
            ghcr.io/ininia/scanx-scanner-all:dev scan --engine exec --path /work/src --out /work/out \
            --fail-on high --exclude testdata --exclude docs/examples --exclude .e2e-out --exclude self-scan \
            --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Upload self-scan SARIF
        if: always() && hashFiles('self-scan/scanx.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: self-scan/scanx.sarif
          category: scanx-self-scan
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanx-reports
          path: |
            self-scan/scanx.html
            self-scan/scanx.json
            .e2e-out/scanx.html
          if-no-files-found: ignore
